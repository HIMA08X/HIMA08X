<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#0d0a14"/>
      <stop offset="50%"  style="stop-color:#1c1433"/>
      <stop offset="100%" style="stop-color:#0d0a14"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="12"/>

  <!-- Animated particles -->
  <circle cx="60"  cy="40"  r="2"   fill="#b9a4f5" opacity="0.5"><animate attributeName="cy" values="40;160;40"   dur="4s"   repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="150" cy="100" r="1.5" fill="#b9a4f5" opacity="0.3"><animate attributeName="cy" values="100;30;100"  dur="3s"   repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="60"  r="2"   fill="#b9a4f5" opacity="0.4"><animate attributeName="cy" values="60;160;60"   dur="5s"   repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0.1;0.4" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="760" cy="120" r="1.5" fill="#8a73d6" opacity="0.3"><animate attributeName="cy" values="120;40;120"  dur="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="320" cy="25"  r="1"   fill="#b9a4f5" opacity="0.2"><animate attributeName="cy" values="25;175;25"   dur="6s"   repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.5;0.2" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="480" cy="170" r="1.5" fill="#b9a4f5" opacity="0.25"><animate attributeName="cy" values="170;20;170" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.25;0.5;0.25" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="580" cy="50"  r="1"   fill="#8a73d6" opacity="0.3"><animate attributeName="cy" values="50;150;50"   dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="160" r="2"   fill="#b9a4f5" opacity="0.2"><animate attributeName="cy" values="160;30;160"  dur="5.5s" repeatCount="indefinite"/></circle>

  <!-- Accent lines -->
  <line x1="60" y1="18"  x2="740" y2="18"  stroke="#b9a4f5" stroke-width="0.5" opacity="0.3"/>
  <line x1="60" y1="182" x2="740" y2="182" stroke="#b9a4f5" stroke-width="0.5" opacity="0.3"/>

  <!-- Corner brackets -->
  <text x="20"  y="36" font-family="monospace" font-size="20" fill="#b9a4f5" opacity="0.6">[</text>
  <text x="768" y="36" font-family="monospace" font-size="20" fill="#b9a4f5" opacity="0.6">]</text>

  <!-- Greeting -->
  <text x="400" y="58" text-anchor="middle" font-family="'Segoe UI', monospace" font-size="15" fill="#9a8fb8" letter-spacing="2" filter="url(#glow)">Welcome, visitor</text>

  <!-- Name -->
  <text x="400" y="108" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="bold" fill="#c4b2ff" filter="url(#glow)">Ibrahim El Sayed</text>

  <!-- Title -->
  <text x="400" y="142" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" fill="#9d9ab0" letter-spacing="1">Full-Stack ASP.NET Core</text>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
